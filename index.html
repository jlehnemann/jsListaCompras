<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quicklist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img id="img-logo" src="logo.png" alt="Quicklist">
    </header>

    <div id="div-back-button">
        <button id="back-button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
        </svg>Voltar
    </button>
    </div>

    <h1>
        Compras da semana
    </h1>

    <div id="input-form" class="div">  
        <input type="text" name="input-item" id="input-item" value="Adicione um novo item">
        <input type="button" id="submit-button" value="Adicionar item" onclick="addItem()">
    </div>

    <div id="item-list-div" class="item-list-div">
        <div id="item-div" class="item-div">
            <input type="checkbox" name="item-1" id="item-1" class="item-checkbox">
            <label for="item-1">Pão de forma</label>
            <button type="button" class="remove-button"></button>
        </div>
    </div>

    <div id="item-list-div" class="item-list-div">
        <div id="item-div" class="item-div">
            <input type="checkbox" name="item-2" id="item-2" class="item-checkbox">
            <label for="item-2">Café preto</label>
            <button type="button" class="remove-button"></button>
        </div>
    </div>

    <div id="item-list-div" class="item-list-div">
        <div id="item-div" class="item-div">
            <input type="checkbox" name="item-3" id="item-3" class="item-checkbox">
            <label for="item-3">Suco de laranja</label>
            <button type="button" class="remove-button"></button>
        </div>
    </div>

    <div id="item-list-div" class="item-list-div">
        <div id="item-div" class="item-div">
            <input type="checkbox" name="item-4" id="item-4" class="item-checkbox">
            <label for="item-4">Bolacha</label>
            <button type="button" class="remove-button"></button>
        </div>
    </div>


    <footer class="hide-footer">
        <img id="alert-icon"  src="exclamation_mark.png" alt="Atenção">
        <label id="label-footer" for="img">O item foi removido da lista.</label>
        <button type="button" id="close-alert-button"></button>
    </footer>

    
    <script src="script.js"></script>
</body>
</html>
